  <rect class="caixa dados" x="75" y="366" width="220" height="50" rx="10"/>
  <text class="tit" x="185" y="396" text-anchor="middle">boletins/ (.txt e .pdf)</text>

  <path class="seta" d="M395 68 L250 118" marker-end="url(#pt)"/>
  <path class="seta" d="M505 68 L650 118" marker-end="url(#pt)"/>
  <text class="rot" x="232" y="88">cria as janelas</text>
  <text class="rot" x="590" y="88">cria o modelo</text>
  <path class="seta" d="M352 190 L548 190" marker-end="url(#pt)"/>
  <text class="rot" x="450" y="182" text-anchor="middle">chama métodos</text>
  <path class="seta" d="M548 240 L352 240" marker-end="url(#pt)"/>
  <text class="rot" x="450" y="232" text-anchor="middle">avisa os ouvintes</text>
  <text class="rot" x="450" y="258" text-anchor="middle">(evento)</text>
  <path class="seta" d="M715 364 L715 312" marker-end="url(#pt)"/>
  <text class="rot" x="723" y="342">CarregadorEleicao lê</text>
  <path class="seta" d="M185 312 L185 364" marker-end="url(#pt)"/>
