<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-label="Diagrama de camadas do simulador">
<style>
text { font-family: 'Segoe UI', 'Liberation Sans', Arial, sans-serif; fill: #1d232a; }
.caixa { fill: #ffffff; stroke: #5b6672; stroke-width: 1.4; }
.caixa.modelo { fill: #e3f3ea; stroke: #1f6f43; }
.caixa.interface { fill: #e6eff9; stroke: #1d5fa8; }
.caixa.dados { fill: #fbeee2; stroke: #b85c12; }
.seta { stroke: #5b6672; stroke-width: 1.6; fill: none; }
.rot { font-size: 12px; fill: #5b6672; }
.tit { font-size: 15px; font-weight: 700; }
.peq { font-size: 12.5px; }
</style>
<rect x="0" y="0" width="900" height="430" fill="#ffffff"/>
  <defs><marker id="pt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" style="fill: #5b6672"/></marker></defs>
  <rect class="caixa" x="350" y="14" width="200" height="54" rx="10"/>
  <text class="tit" x="450" y="38" text-anchor="middle">main.py</text>
  <text class="peq" x="450" y="57" text-anchor="middle">classe Aplicacao</text>

  <rect class="caixa interface" x="20" y="120" width="330" height="190" rx="12"/>
  <text class="tit" x="185" y="148" text-anchor="middle">interface/ (PySide6)</text>
  <text class="peq" x="40" y="180">JanelaTerminal · LeitorBiometrico · Led</text>
  <text class="peq" x="40" y="204">JanelaUrna · TelaUrna</text>
  <text class="peq" x="40" y="228">DialogoDocumento</text>
  <text class="peq" x="40" y="252">ExportadorDocumento</text>
  <text class="peq" x="40" y="276">Pincel(QPainter) · Sons · Creditos</text>

  <rect class="caixa modelo" x="550" y="120" width="330" height="190" rx="12"/>
