  <text class="peq" x="570" y="204">Eleicao · Secao · Cargo · Previa</text>
  <text class="peq" x="570" y="228">Candidato · Vice · Partido</text>
  <text class="peq" x="570" y="252">Pessoa → Eleitor, Mesario</text>
  <text class="peq" x="570" y="276">ImpressoraUrna · Documento · MemoriaUrna</text>
  <text class="peq" x="570" y="300">CarregadorEleicao · ErroUrna (+10)</text>

  <rect class="caixa dados" x="605" y="366" width="220" height="50" rx="10"/>
